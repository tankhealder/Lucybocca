<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rechenweg-Werkstatt</title>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Rechenweg-Werkstatt: Brüche (· : + −) und Kommazahlen (·) Schritt für Schritt wie im Heft – Funki aus MathPets hilft */
:root{
  --ink:#3a2e5c; --ink-soft:#7a6f96; --paper:#fffdf7; --grid:#dfe9f7; --purple:#9b5de5; --pink:#ff7eb6; --green:#4cbf74; --red:#ff6b6b; --yellow:#ffd23f; --soft:#f4effd;
  --font:Fredoka,"Segoe UI",system-ui,sans-serif; --emoji:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{font-family:var(--font);color:var(--ink);background:#efe8ff}
button{font-family:inherit;color:inherit;border:0;cursor:pointer;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--purple);outline-offset:2px}
#app{max-width:720px;margin:0 auto;padding:0 12px 40px}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#fff;border-radius:0 0 22px 22px;box-shadow:0 4px 0 rgba(58,46,92,.07);margin:0 -12px 12px}
.logo{font-weight:700;font-size:20px;white-space:nowrap}
.logo span{font-family:var(--emoji)}
.grow{flex:1;min-width:0}
.pill{background:#fff4d6;border-radius:14px;padding:6px 10px;font-weight:600;font-size:16px;white-space:nowrap}
.iconbtn{width:40px;height:40px;border-radius:14px;background:var(--soft);font-size:19px;flex:none;font-family:var(--emoji);display:grid;place-items:center;text-decoration:none}
.coach{display:flex;align-items:flex-end;gap:10px;margin:4px 0 10px}
.mascot{width:78px;flex:none;animation:bob 2.4s ease-in-out infinite}
.mascot svg{width:100%;height:auto;display:block;overflow:visible}
.mascot .eo{animation:blink 4.5s infinite;transform-box:fill-box;transform-origin:center}
.mascot .eh,.mascot .es{display:none}
.mascot.happy .eo{display:none}
.mascot.happy .eh{display:inline}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes bob{50%{transform:translateY(-5px)}}
.speech{background:#fff;border-radius:18px 18px 18px 4px;padding:10px 14px;font-weight:600;font-size:17px;box-shadow:0 3px 0 rgba(58,46,92,.08);margin-bottom:12px}
/* Auswahl */
.pick{background:#fff;border-radius:22px;padding:12px;box-shadow:0 5px 0 rgba(58,46,92,.08);margin-bottom:12px}
.pick h3{margin:2px 4px 8px;font-size:15px;color:var(--ink-soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 14px;border-radius:16px;background:var(--soft);font-weight:700;font-size:18px;box-shadow:0 3px 0 #ddd2f3}
.chip small{display:block;font-size:12px;font-weight:600;color:var(--ink-soft)}
.chip.on{background:var(--purple);color:#fff;box-shadow:0 3px 0 #7442c2}
.chip.on small{color:#efe3ff}
.btn{padding:12px 18px;border-radius:16px;font-size:18px;font-weight:700;background:var(--purple);color:#fff;box-shadow:0 4px 0 #7442c2;white-space:nowrap}
.btn.alt{background:#fff;color:var(--ink);box-shadow:0 4px 0 #ddd2f3}
.btn.green{background:var(--green);box-shadow:0 4px 0 #36985a}
.btn.small{padding:8px 12px;font-size:16px}
.btn:active{transform:translateY(3px)}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
/* Heft */
.heft{background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;
  border-radius:20px;padding:16px 14px 18px;box-shadow:0 6px 0 rgba(58,46,92,.1),inset 4px 0 0 #ffb3c9}
.aufgabe{font-size:clamp(30px,8vw,42px);font-weight:700;display:flex;align-items:center;justify-content:center;gap:.3em;flex-wrap:wrap;margin:4px 0 12px}
.frac{display:inline-flex;flex-direction:column;align-items:center;line-height:1.05;vertical-align:middle}
.frac>*:first-child{border-bottom:.08em solid currentColor;padding:0 .14em .05em}
.frac>*:last-child{padding:.05em .14em 0}
.step{background:rgba(255,255,255,.88);border-radius:16px;padding:10px 12px;margin-top:10px;box-shadow:0 2px 0 rgba(58,46,92,.08)}
.step.done{background:rgba(230,249,236,.92)}
.step .st{font-size:14px;font-weight:700;color:var(--purple);text-transform:uppercase;letter-spacing:.04em}
.step .sx{font-size:clamp(22px,6vw,30px);font-weight:700;display:flex;align-items:center;gap:.3em;flex-wrap:wrap;margin:6px 0}
.step .info{font-size:16px;font-weight:500;color:var(--ink-soft);margin:2px 0}
.num{width:2.6em;font:inherit;font-size:inherit;font-weight:700;text-align:center;color:var(--purple);border:3px solid #d9d0f0;border-radius:12px;padding:2px 4px;background:#fff}
.num.w{width:4.2em}
.num:focus{outline:none;border-color:var(--purple);background:#faf6ff}
.num:disabled{color:var(--green);border-color:#bfe8cc;background:#f3fbf5}
.frac .num{font-size:.8em;margin:2px 0}
.fb{font-size:16px;font-weight:600;min-height:1.2em;margin-top:4px}
.fb.bad{color:#d24c4c}
.fb.good{color:#2f9a55}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.fertig{text-align:center;margin-top:14px}
.fertig .big{font-size:56px;font-family:var(--emoji);line-height:1.1}
.fertig .stars{font-size:30px;font-family:var(--emoji);letter-spacing:4px}
.weg{font-size:clamp(18px,5vw,24px);font-weight:700;display:flex;align-items:center;justify-content:center;gap:.25em;flex-wrap:wrap;margin:8px 0}
/* Eigene Aufgabe */
.modal{position:fixed;inset:0;background:rgba(58,46,92,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:14px}
.modal.open{display:flex}
.mcard{background:#fff;border-radius:26px;padding:20px 18px;max-width:460px;width:100%;max-height:92vh;overflow-y:auto;text-align:center;animation:mpop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes mpop{from{transform:scale(.7);opacity:0}}
.mcard h2{margin:4px 0 10px}
.own{font-size:28px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:.3em;flex-wrap:wrap;margin:12px 0}
.own select{font:inherit;font-size:26px;border:3px solid #d9d0f0;border-radius:12px;padding:2px 6px;background:#fff;color:var(--ink)}
.toast{position:fixed;left:50%;top:76px;transform:translateX(-50%);background:var(--yellow);padding:10px 18px;border-radius:18px;font-weight:700;font-size:17px;box-shadow:0 4px 0 #d9ab1c;z-index:60;animation:toast 2.6s forwards;max-width:calc(100% - 28px);text-align:center}
@keyframes toast{0%{transform:translate(-50%,-120px)}12%,85%{transform:translate(-50%,0)}100%{transform:translate(-50%,-140px)}}
.confetti{position:fixed;width:9px;height:13px;border-radius:3px;pointer-events:none;z-index:55}
@media (prefers-reduced-motion:reduce){.mascot{animation:none}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo"><span>📝</span> Rechenweg-Werkstatt</div>
    <div class="grow"></div>
    <div class="pill" id="hud">⭐ 0</div>
    <a class="iconbtn" href="index.html" aria-label="Zu MathPets">🐾</a>
  </header>

  <div class="coach"><div class="mascot" id="mascot"></div><div class="speech" id="say">Hallo! Ich bin Funki. Wir rechnen Schritt für Schritt – wie im Heft! ✏️</div></div>

  <div class="pick">
    <h3>Was rechnen wir?</h3>
    <div class="chips" id="kinds"></div>
    <br>
    <div class="btns"><button class="btn" id="newBtn">🎲 Neue Aufgabe</button><button class="btn alt" id="ownBtn">✏️ Eigene Aufgabe</button></div>
  </div>

  <div class="heft" id="heft" hidden>
    <div class="aufgabe" id="aufgabe"></div>
    <div id="steps"></div>
    <div class="fertig" id="fertig" hidden></div>
  </div>
</div>

<div class="modal" id="ownModal"><div class="mcard">
  <h2>Eigene Aufgabe ✏️</h2>
  <p style="color:var(--ink-soft);margin:0">Zum Beispiel aus den Hausaufgaben.</p>
  <div class="chips" id="ownKinds" style="justify-content:center;margin-top:10px"></div>
  <div class="own" id="ownFrac">
    <span class="frac"><input class="num" id="oa" inputmode="numeric"><input class="num" id="ob" inputmode="numeric"></span>
    <select id="oop"><option value="*">·</option><option value=":">:</option><option value="+">+</option><option value="-">−</option></select>
    <span class="frac"><input class="num" id="oc" inputmode="numeric"><input class="num" id="od" inputmode="numeric"></span>
  </div>
  <div class="own" id="ownDec" hidden>
    <input class="num w" id="ox" inputmode="decimal" placeholder="0,25"> · <input class="num w" id="oy" inputmode="decimal" placeholder="0,4">
  </div>
  <div class="btns"><button class="btn alt" id="ownCancel">Abbrechen</button><button class="btn" id="ownGo">Los geht’s!</button></div>
</div></div>

<script>
/* ================= Funki: dieselbe Zeichnung wie in MathPets (aus Lucybocca/index.html übernommen) ================= */
const A = { drache:   {hab:'zauber', name:'Funki', label:'Glücksdrache', g:'der', c:'#fff8f1', b:'#fffdfa', luck:'#f4cdbd', feet:'#f4cdbd', nose:'nostrils', mouth:'smile', fav:'muffin', say:'Nie aufgeben! ✨'} };
const ACCM = {};
const INK = '#2d2440';
function mix(a, b, t){
  const p = h => [1,3,5].map(i => parseInt(h.slice(i, i+2), 16));
  const x = p(a), y = p(b);
  return '#' + x.map((v,i) => Math.round(v + (y[i]-v)*t).toString(16).padStart(2,'0')).join('');
}
const line = f => mix(f, '#3a2e5c', .42);
const fs = (f, ns) => ns ? `fill="${f}"` : `fill="${f}" stroke="${line(f)}"`;
const E  = (cx,cy,rx,ry,f,rot=0,ns) => `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" ${fs(f,ns)}${rot ? ` transform="rotate(${rot} ${cx} ${cy})"` : ''}/>`;
const Ep = (cx,cy,rx,ry,f,rot=0,ns) => E(cx,cy,rx,ry,f,rot,ns) + E(120-cx,cy,rx,ry,f,-rot,ns);
const P  = (d,f,ns) => `<path d="${d}" ${fs(f,ns)}/>`;
const mir = d => d.replace(/(-?\d+(?:\.\d+)?) (-?\d+(?:\.\d+)?)/g, (m,x,y) => `${+(120-x).toFixed(2)} ${y}`);
const Pp = (d,f,ns) => P(d,f,ns) + P(mir(d),f,ns);
const S_ = (d,c,w=2.4) => `<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}"/>`;
const star = (x,y,r,f) => `<path d="M${x} ${y-r} Q${x} ${y} ${x+r} ${y} Q${x} ${y} ${x} ${y+r} Q${x} ${y} ${x-r} ${y} Q${x} ${y} ${x} ${y-r}Z" fill="${f}"/>`;
function spikes(cx,cy,rx,ry,out,n,a0,a1,f){
  let d = '';
  for (let i=0; i<=n*2; i++){
    const a = (a0 + (a1-a0)*i/(n*2)) * Math.PI/180, o = i % 2 ? out : 0;
    d += (i ? 'L' : 'M') + (cx + (rx+o)*Math.cos(a)).toFixed(1) + ' ' + (cy + (ry+o)*Math.sin(a)).toFixed(1) + ' ';
  }
  return P(d + 'Z', f);
}

function petSVG(type, acc = {}){
  const t = A[type], c = t.c, b = t.b || mix(c, '#ffffff', .6), blob = t.body === 'blob';
  const ec = t.earC || c, inner = t.inner || '#ffb8d2', limb = t.limb || c, feet = t.feet || limb;
  const hy = t.hy ?? (blob ? 78 : 56), hrx = t.hrx ?? (blob ? 46 : 42), hry = t.hry ?? (blob ? 40 : 36);
  const top = hy - hry;
  const fy = t.fy ?? (blob ? 80 : 60);
  const eyY = t.eyeY ?? fy, eyX = t.eyeX ?? 17;
  let back = '', body = '', head = '', face = '', front = '';

  /* --- hinter dem Kopf --- */
  if (t.mane) back += E(38,20,12,12,'#c7a8ff') + E(54,12,12,12,'#ffa8d6') + E(72,14,11,11,'#8fd8ff') + E(86,25,9,9,'#fff0a0');
  if (t.wool) for (let i=0; i<14; i++){ const a = i/14*Math.PI*2; back += E((60 + 45*Math.cos(a)).toFixed(1), (hy + 39*Math.sin(a)).toFixed(1), 11, 11, '#ffffff'); }
  if (t.lmane){ // Löwenmähne: Kranz aus Locken um den Kopf, außen dunkler
    for (let i=0; i<16; i++){ const a = i/16*Math.PI*2; back += E((60 + 46*Math.cos(a)).toFixed(1), (hy + 40*Math.sin(a)).toFixed(1), 14, 14, t.lmane); }
    for (let i=0; i<16; i++){ const a = (i+.5)/16*Math.PI*2; back += E((60 + 38*Math.cos(a)).toFixed(1), (hy + 33*Math.sin(a)).toFixed(1), 12, 12, mix(t.lmane,'#ffd166',.35), 0, true); }
  }
  if (t.spikes) back += spikes(60, hy, 40, 34, 14, 12, 150, 390, t.spikes);
  if (t.pspikes) back += spikes(60, hy, 44, 38, 8, 18, 0, 360, mix(c, '#ff9f43', .35));
  if (t.luck){ // Kuscheldrache nach Lucys Plüschtier
    const pk = t.luck;
    // kleine Glitzerflügel mit gewelltem Rand (wie Finger), links gebaut und gespiegelt
    const wing = s => {
      const X = x => s < 0 ? x : 120 - x;
      return [[2,64,6,11,-50],[9,55,6,11,-30],[19,51,6,11,-10],[29,54,5.5,10,10]].map(([x,y,rx,ry,r]) => E(X(x),y,rx,ry,pk,s*-r)).join('')
        + E(X(23),77,17,12,pk,-s*35)
        + [[16,72],[25,68],[22,82],[11,64]].map(([x,y]) => `<circle cx="${X(x)}" cy="${y}" r="1.3" fill="#ffffff"/>`).join('');
    };
    back += `<g class="wing dwl">${wing(-1)}</g><g class="wing dwr">${wing(1)}</g>`;
    // große, seitlich abstehende Ohren
    back += Ep(12,44,19,10,c,-12) + Ep(13,44,11,5,pk,-12,true);
    // zwei Hörner neben den Ohren, leicht nach außen gebogen
    back += Pp('M31 34 C26 24 23 14 25 4 C32 9 38 19 42 30Z', pk) + Pp('M28 12 C30 14 32 16 33 18', mix(pk,'#ffffff',.5), true);
    // kurzer, dicker Schwanz mit Zacke
    back += `<g class="ltail">${E(96,114,17,8,c,-25)}${E(106,104,3.5,4.5,pk)}</g>`;
  }
  if (t.wings){ // große Flügel hinter dem Körper (Federn oder Haut wie beim Flugsaurier), schlagen beim Fliegen
    const [wc, wi] = t.wings;
    const w = t.bat ? 'M46 96 C30 70 10 50 -10 40 C-2 56 0 66 6 72 C12 70 16 74 18 80 C24 78 30 84 34 90Z'
                    : 'M46 98 C24 100 2 84 -6 34 C6 46 14 50 20 50 C16 62 20 70 28 72 C24 82 32 90 46 90Z';
    const iw = t.bat ? 'M42 92 C30 76 14 60 0 52 C6 64 10 72 22 82Z' : 'M42 94 C26 94 10 80 4 54 C14 66 22 72 30 76 C32 84 38 88 42 90Z';
    back += `<g class="wing dwl">${P(w,wc)}${P(iw,wi,true)}</g><g class="wing dwr">${P(mir(w),wc)}${P(mir(iw),wi,true)}</g>`;
  }
  if (t.antlers){ // Rentiergeweih: verzweigt, links gebaut und gespiegelt
    const d = 'M44 26 C40 14 34 6 26 -2 M37 14 C31 13 24 15 18 12 M32 6 C33 -2 38 -8 42 -12 M28 1 C22 -3 18 -9 18 -14';
    back += S_(d + ' ' + mir(d), line(t.antlers), 7) + S_(d + ' ' + mir(d), t.antlers, 4.4);
  }
  if (t.crest) back += P(`M56 ${top+8} C68 ${top-12} 94 ${top-20} 110 ${top-18} C96 ${top-6} 80 ${top+4} 68 ${top+12}Z`, t.crest); // Flugsaurier-Kamm
  if (t.hump) back += E(90,90,16,15,c);
  switch (t.tail){
    case 'squirrel': back += P('M80 118 C118 118 124 70 104 44 C94 32 74 40 84 56 C92 70 90 92 76 100Z', c) + P('M86 104 C108 100 112 74 100 58', mix(c,'#ffffff',.5), true); break;
    case 'gecko':    back += P('M76 116 C100 126 114 108 104 94 C98 88 90 94 96 100 C100 108 90 112 78 108Z', c); break;
    case 'jerboa':   back += S_('M80 116 C106 120 108 94 112 76', line(c), 3) + E(112,72,6,8,'#ffffff'); break;
    case 'lion':     back += S_('M80 112 C104 118 112 100 106 82', line(t.bodyC || c), 5) + S_('M80 112 C104 118 112 100 106 82', t.bodyC || c, 3) + E(106,78,7,9,t.tuft || t.lmane); break;
    case 'horse':    { const d = 'M80 104 C100 100 110 112 104 128'; back += S_(d, line(t.hair), 11) + S_(d, t.hair, 8); break; }
    case 'plume': { // Papillon: großer, flauschiger Puschelschwanz (Lucys Wunsch)
      const cx = 110, cy = 84;
      back += S_('M78 108 C88 106 98 100 104 94', line('#ffffff'), 12) + S_('M78 108 C88 106 98 100 104 94', '#ffffff', 9);
      for (let i=0; i<12; i++){ const a = i/12*Math.PI*2; back += E((cx + 22*Math.cos(a)).toFixed(1), (cy + 22*Math.sin(a)).toFixed(1), 11, 11, '#ffffff'); }
      back += E(cx, cy, 25, 25, '#ffffff', 0, true) + E(cx-6, cy-8, 8, 5, '#f4efe9', -20, true) + E(cx+8, cy+8, 7, 4, '#f4efe9', 20, true); break;
    }
    case 'kangaroo': back += P('M76 112 C98 124 118 120 122 106 C110 112 96 110 80 102Z', c); break;
    case 'dino':     back += P('M78 114 C100 120 118 110 121 92 C112 102 98 104 82 102Z', c); break;
    case 'phoenix':  back += P('M78 110 C100 112 118 96 121 76 C112 90 102 94 94 94 C106 86 110 74 107 60 C98 78 90 88 80 98Z', '#ff6b4a')
                       + P('M82 106 C98 106 110 96 114 84 C106 92 98 96 88 98Z', '#ffd166', true); break;
    case 'fish':     back += P('M98 80 L119 62 L115 96Z', mix(c,'#ff9f43',.35)); break;
    case 'whale':    back += P('M96 98 C106 92 108 80 119 70 C121 86 117 100 104 106Z', c); break;
  }
  if (t.tentacles) [24,42,60,78,96].forEach((x,i) => back += `<g class="tent${i%2 ? ' t2' : ''}">${E(x, 104 + (i%2)*3, 9, 14, c, (x-60)/3)}</g>`);
  if (t.fins) back += Ep(12,86,10,6,mix(c,'#ff9f43',.35),25);
  if (t.flippers) back += Ep(16,104,13,7,c,35);
  if (t.crab){
    back += S_(`M44 ${top+4} L44 ${eyY+6} M76 ${top+4} L76 ${eyY+6}`, line(c), 4);
    back += S_(mir('M22 100 L8 112 M28 108 L16 122') + ' M22 100 L8 112 M28 108 L16 122', line(c), 3.5);
    back += Ep(12,64,8,13,c,-25) + Ep(22,62,8,13,c,25);
    back += Ep(60-eyX, eyY, 10, 10, '#ffffff');
  }
  switch (t.ears){
    case 'cat':    back += Pp('M28 40 L26 6 L54 24Z', ec) + Pp('M32 32 L31 14 L46 25Z', inner, true); break;
    case 'bunny':  back += Ep(44,0,10,25,ec,-12) + Ep(44,3,5,17,inner,-12,true); break;
    case 'round':  back += Ep(28,26,12,12,ec) + Ep(28,26,6,6,t.earIn || b,0,true); break;
    case 'mouse':  back += Ep(24,30,17,17,ec) + Ep(24,30,10,10,inner,0,true); break;
    case 'pig':    back += Pp('M30 34 L27 12 L48 24Z', ec) + Pp('M32 29 L31 17 L43 25Z', inner, true); break;
    case 'owl':    back += Pp('M24 38 L18 8 L46 24Z', ec); break;
    case 'donkey': back += Ep(33,2,10,25,ec,-22) + Ep(33,5,5,17,inner,-22,true); break;
    case 'deer':   back += Ep(16,38,15,7,ec,-28) + Ep(17,38,9,3.5,inner,-28,true); break;
    case 'bat':    back += Pp('M30 42 L16 -4 L54 22Z', ec) + Pp('M33 33 L23 6 L46 23Z', inner, true); break;
    case 'small':  back += Ep(22,34,8,8,ec) + Ep(22,34,4,4,inner,0,true); break;
    case 'fennec': back += Ep(22,8,13,28,ec,-32) + Ep(23,10,7,19,inner,-32,true); break;
    case 'jerboa': back += Ep(36,-2,11,22,ec,-18) + Ep(36,1,6,15,inner,-18,true); break;
    case 'frog':   back += Ep(40,eyY,15,15,c); break;
    case 'koala': back += Ep(20,34,19,18,c) + Ep(21,35,12,11,'#f4f6f8',0,true) + [[8,26],[10,42],[16,20]].map(([x,y]) => Ep(x,y,4,4,'#f4f6f8',0,true)).join(''); break;
    case 'puffy': { // Papillon (Lucys Wunsch): Ohren als lange, schräg aufgestellte Fell-Puschel
      const [cx, cy, rx, ry, rot] = [19, 13, 11, 24, -42], th = rot * Math.PI / 180;
      for (let i=0; i<14; i++){
        const a = i/14*Math.PI*2, px = rx*Math.cos(a), py = ry*Math.sin(a);

  if (t.pumpkin) [13, 27].forEach(dx => head += S_(`M${60-dx} ${top+4} Q${60-dx*1.4} ${hy} ${60-dx} ${hy+hry-3}`, mix(c,'#c25a10',.5), 2) + S_(`M${60+dx} ${top+4} Q${60+dx*1.4} ${hy} ${60+dx} ${hy+hry-3}`, mix(c,'#c25a10',.5), 2));
  head += `<ellipse cx="${60-hrx*.48}" cy="${hy-hry*.5}" rx="10" ry="6" fill="#ffffff" opacity=".5" transform="rotate(-20 ${60-hrx*.48} ${hy-hry*.5})"/>`;

  if (t.luck) face += E(60, eyY-9, 4, 8, t.luck, 0, true) + E(60, fy+9, 18, 12, b); // Stirnfleck + breite Schnauze

  if (t.narhorn) front += P(`M57 ${top+4} L60 ${top-34} L63 ${top+4}Z`, '#fff3d6') + S_(`M57.8 ${top-6} L62.2 ${top-9} M58.6 ${top-18} L61.4 ${top-20}`, '#d8c39a', 1.6);

  if (t.moon) front += star(92, 12, 6, '#ffe27a') + star(26, 6, 4, '#ffe27a');

  if (t.citrus) front += E(66, top+1, 9, 8, '#ff9f1c') + E(69, top-7, 4, 2, '#5cc97b', -25) + `<circle cx="63" cy="${top-1}" r="2" fill="#ffd27a"/>`; // Capybara mit Mandarine auf dem Kopf

  /* --- Accessoires --- */
  let over = '';
  const em = (e, x, y, size, rot=0) => `<text class="acc-e" x="${x}" y="${y}" font-size="${size}" text-anchor="middle" dominant-baseline="central"${rot ? ` transform="rotate(${rot} ${x} ${y})"` : ''}>${e}</text>`;

    ? `<svg x="${x - size/2}" y="${y - size/2}" width="${size}" height="${size}" viewBox="-50 -50 100 100" overflow="visible"><g transform="rotate(${rot})">${a.svg}</g></svg>`
    : em(a.e, x, y, size, rot);
  if (acc.neck && ACCM[acc.neck]) over += ac(ACCM[acc.neck], 60, blob ? hy+hry-8 : 92, 30);
  if (acc.eyes && ACCM[acc.eyes]) over += ac(ACCM[acc.eyes], 60, eyY+1, eyX*2 + 16);
  if (acc.hat && ACCM[acc.hat]) over += ac(ACCM[acc.hat], 60, t.hatY ?? top - 8, 48);
  if (acc.side && ACCM[acc.side]) over += ac(ACCM[acc.side], 92, top + 8, 26, 18);

  return `<svg viewBox="0 -24 120 154" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${t.label}">
    <ellipse cx="60" cy="125" rx="${blob ? 36 : 28}" ry="4.5" fill="rgba(40,30,70,.14)"/>
    <g stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">${back}${body}${head}${face}${front}</g>${over}
  </svg>`;
}

let AC;
function tone(f, d = .12, type = 'sine', when = 0, vol = .1, f2){
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const t = AC.currentTime + when, o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d + .02);
  } catch {}
}

function oneFrac(){ let d, n; do { d = rnd(2, 10); n = rnd(1, d - 1); } while (gcd(n, d) !== 1); return [n, d]; }

    const str = (m, k) => (m / 10 ** k).toFixed(k).replace('.', ',');

  const op = kind[1];
  let [a, b] = oneFrac(), [c, d] = oneFrac();
  if (op === '-' && a * d <= c * b){ if (a * d === c * b) return randomTask(kind); [a, b, c, d] = [c, d, a, b]; }
  return { kind:'frac', op, a, b, c, d };
}

/* ================= Rechenweg: Schritt für Schritt =================
   W = Arbeitsstand; jeder Schritt hat Felder (data-k), eine Prüfung und einen Tipp. */
let W = null;
function start(t){
  W = { ...t, help:0, wrong:0, line:[] };
  $('#heft').hidden = false; $('#fertig').hidden = true; $('#steps').innerHTML = '';
  if (t.kind === 'frac'){
    $('#aufgabe').innerHTML = `${fr(t.a, t.b)} ${OPS[t.op]} ${fr(t.c, t.d)} =`;
    W.phase = t.op === ':' ? 'kehr' : t.op === '*' ? 'zz' : t.b === t.d ? 'same' : 'hn';
  } else {
    W.mx = parseInt(t.x.replace(',', ''), 10); W.my = parseInt(t.y.replace(',', ''), 10);
    W.dx = (t.x.split(',')[1] || '').length; W.dy = (t.y.split(',')[1] || '').length;
    $('#aufgabe').innerHTML = `${t.x} · ${t.y} =`;
    W.phase = 'd1';
  }
  say(pick(['Los geht’s! Schritt für Schritt. 💪','Wir schaffen das zusammen! ✏️','Erster Schritt – schau genau hin! 👀']));
  next();
  $('#heft').scrollIntoView({ behavior:'smooth', block:'start' });
}
const inp = (k, wide) => `<input class="num ${wide ? 'w' : ''}" data-k="${k}" inputmode="${wide ? 'decimal' : 'numeric'}" autocomplete="off">`;
const finp = (k1, k2) => `<span class="frac">${inp(k1)}${inp(k2)}</span>`;

// Beschreibung des aktuellen Schritts: { title, info, html, check(v) → true | Fehlertext, tip, after(v) }
function stepFor(){
  const w = W;
  switch (w.phase){
    /* --- Brüche geteilt: Kehrwert --- */
    case 'kehr': return { title:'Kehrwert bilden', info:`Durch einen Bruch teilen heißt: mal den Kehrwert nehmen. Beim Kehrwert tauschen Zähler und Nenner die Plätze.`,
      html:`Kehrwert von ${fr(w.c, w.d)} = ${finp('n', 'd')}`,
      check:v => v.n === w.d && v.d === w.c ? true : 'Tausche Zähler und Nenner: oben kommt der Nenner hin, unten der Zähler.',
      tip:{ n:w.d, d:w.c },
      after:() => { w.line.push(`${fr(w.a, w.b)} · ${fr(w.d, w.c)}`); [w.c, w.d] = [w.d, w.c]; w.op = '*'; w.phase = 'zz'; } };
    /* --- Brüche mal --- */
    case 'zz': return { title:'Zähler mal Zähler', info:'Beim Malnehmen rechnest du oben mal oben …',
      html:`${w.a} · ${w.c} = ${inp('z')}`, check:v => v.z === w.a * w.c ? true : `Rechne ${w.a} mal ${w.c}.`, tip:{ z:w.a * w.c },
      after:v => { w.n = v.z; w.phase = 'nn'; } };
    case 'nn': return { title:'Nenner mal Nenner', info:'… und unten mal unten.',
      html:`${w.b} · ${w.d} = ${inp('q')}`, check:v => v.q === w.b * w.d ? true : `Rechne ${w.b} mal ${w.d}.`, tip:{ q:w.b * w.d },
      after:v => { w.q = v.q; w.line.push(fr(`${w.a}·${w.c}`, `${w.b}·${w.d}`), fr(w.n, w.q)); w.phase = 'kuerz'; } };
    /* --- Brüche plus/minus --- */
    case 'same': w.N = w.b; w.e1 = w.a; w.e2 = w.c; w.phase = 'sum'; return stepFor(); // schon gleichnamig
    case 'hn': return { title:'Gleicher Nenner', info:`Plus und Minus geht nur mit gleichem Nenner. Welche Zahl ist durch ${w.b} und durch ${w.d} teilbar? Am besten die kleinste (Hauptnenner).`,
      html:`Gemeinsamer Nenner von ${w.b} und ${w.d}: ${inp('N')}`,
      check:v => v.N > 0 && v.N % w.b === 0 && v.N % w.d === 0 ? true : `${v.N} geht nicht – die Zahl muss in der ${w.b}er- und in der ${w.d}er-Reihe vorkommen.`,
      tip:{ N:lcm(w.b, w.d) },
      after:v => { w.N = v.N; if (v.N !== lcm(w.b, w.d)) toast(`Geht! Kleiner wäre ${lcm(w.b, w.d)} gewesen – dann musst du am Ende mehr kürzen.`); w.phase = 'e1'; } };
    case 'e1': case 'e2': {
      const [n, d] = w.phase === 'e1' ? [w.a, w.b] : [w.c, w.d], k = w.N / d;
      return { title:w.phase === 'e1' ? 'Ersten Bruch erweitern' : 'Zweiten Bruch erweitern', info:`${w.N} : ${d} = ${k} – also oben und unten mal ${k}.`,
        html:`${fr(n, d)} = ${fr(inp('x'), w.N)}`, check:v => v.x === n * k ? true : `Rechne ${n} mal ${k}.`, tip:{ x:n * k },
        after:v => { if (w.phase === 'e1'){ w.e1 = v.x; w.phase = 'e2'; } else { w.e2 = v.x; w.line.push(`${fr(w.e1, w.N)} ${OPS[w.op]} ${fr(w.e2, w.N)}`); w.phase = 'sum'; } } };
    }
    case 'sum': {
      const r = w.op === '+' ? w.e1 + w.e2 : w.e1 - w.e2;
      return { title:w.op === '+' ? 'Zähler addieren' : 'Zähler subtrahieren', info:`Der Nenner ${w.N} bleibt gleich – nur die Zähler werden ${w.op === '+' ? 'zusammengezählt' : 'abgezogen'}.`,
        html:`${w.e1} ${OPS[w.op]} ${w.e2} = ${inp('s')}`, check:v => v.s === r ? true : `Rechne ${w.e1} ${OPS[w.op]} ${w.e2}.`, tip:{ s:r },
        after:v => { w.n = v.s; w.q = w.N; w.line.push(fr(w.n, w.q)); w.phase = 'kuerz'; } };
    }
    /* --- Kürzen (so oft es geht) --- */
    case 'kuerz': {
      if (w.n === 0){ w.phase = 'done'; return null; }
      const g = gcd(w.n, w.q);
      if (g === 1){ w.phase = 'done'; return null; }
      return { title:w.kuerzt ? 'Weiter kürzen' : 'Kürzen', info:w.kuerzt ? 'Geht noch weiter! Gibt es noch eine Zahl, durch die beide teilbar sind?' : `Durch welche Zahl kannst du ${w.n} und ${w.q} beide teilen? Teile oben und unten durch diese Zahl.`,
        html:`${fr(w.n, w.q)} <span style="font-size:.7em">geteilt durch</span> ${inp('k')} = ${finp('n', 'd')}`,
        check:v => {
          if (!(v.k > 1)) return 'Schreib rechts die Zahl hin, durch die du teilst (größer als 1).';
          if (w.n % v.k || w.q % v.k) return `${v.k} geht nicht – ${w.n % v.k ? w.n : w.q} ist nicht durch ${v.k} teilbar.`;
          return v.n === w.n / v.k && v.d === w.q / v.k ? true : `Teile oben ${w.n} : ${v.k} und unten ${w.q} : ${v.k}.`;
        },
        tip:{ k:g, n:w.n / g, d:w.q / g },
        after:v => { w.n = v.n; w.q = v.d; w.kuerzt = true; w.line.push(fr(w.n, w.q)); } };
    }
    /* --- Kommazahlen mal --- */
    case 'd1': return { title:'Ohne Komma rechnen', info:'Vergiss das Komma erst einmal und rechne mit den ganzen Zahlen.',
      html:`${w.mx} · ${w.my} = ${inp('p', true)}`, check:v => v.p === w.mx * w.my ? true : `Rechne ${w.mx} mal ${w.my}.`, tip:{ p:w.mx * w.my },
      after:() => { w.phase = 'd2'; } };
    case 'd2': return { title:'Nachkommastellen zählen', info:'Wie viele Ziffern stehen hinter dem Komma? Zähle bei beiden Zahlen und rechne zusammen.',
      html:`${w.x} hat ${inp('a')} &nbsp; ${w.y} hat ${inp('b')} &nbsp; zusammen ${inp('s')}`,
      check:v => v.a !== w.dx ? `Zähle bei ${w.x} die Ziffern hinter dem Komma.` : v.b !== w.dy ? `Zähle bei ${w.y} die Ziffern hinter dem Komma.` : v.s !== w.dx + w.dy ? `${w.dx} + ${w.dy} = ?` : true,
      tip:{ a:w.dx, b:w.dy, s:w.dx + w.dy },
      after:() => { w.phase = 'd3'; } };
    case 'd3': {
      const k = w.dx + w.dy, p = w.mx * w.my, res = p / 10 ** k, show = String(+res.toFixed(k)).replace('.', ',');
      const pad = String(p).length <= k ? ` Zu wenig Ziffern? Dann schreib Nullen davor: ${'0'.repeat(k - String(p).length + 1)}${p}.` : '';
      return { title:'Komma setzen', info:`Nimm ${p} und zähle von rechts ${k} ${k === 1 ? 'Stelle' : 'Stellen'} ab – dort kommt das Komma hin.${pad}`,
        html:`${w.x} · ${w.y} = ${inp('r', true)}`, check:v => v.r !== null && Math.abs(v.r - res) < 1e-9 ? true : `Fast! Zähle bei ${p} genau ${k} ${k === 1 ? 'Stelle' : 'Stellen'} von rechts ab.`,
        tip:{ r:show }, after:() => { w.res = show; w.phase = 'done'; } };
    }
  }
  return null;
}
// Eingaben lesen: ganze Zahlen oder Kommazahlen („0,045“)
const val = el => { const t = el.value.trim().replace(',', '.'); return t === '' || isNaN(+t) ? null : +t; };
function next(){
  const s = stepFor();
  if (!s) return finish();
  const n = $('#steps').children.length + 1;
  const el = document.createElement('div'); el.className = 'step';
  el.innerHTML = `<div class="st">Schritt ${n}: ${s.title}</div><div class="info">${s.info}</div><div class="sx">${s.html}</div>
    <div class="btns" style="justify-content:flex-start"><button class="btn small" data-act="check">Prüfen ✔</button><button class="btn alt small" data-act="tip">💡 Tipp</button></div><div class="fb"></div>`;
  $('#steps').appendChild(el);
  el._step = s;
  const first = el.querySelector('input'); setTimeout(() => first?.focus({ preventScroll:true }), 80);
  el.scrollIntoView({ behavior:'smooth', block:'nearest' });
  el.querySelectorAll('input').forEach((i, idx, all) => i.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); all[idx + 1] ? all[idx + 1].focus() : checkStep(el); } }));
}
function checkStep(el){
  if (el.classList.contains('done')) return;
  const s = el._step, v = {};
  el.querySelectorAll('[data-k]').forEach(i => v[i.dataset.k] = val(i));
  if (Object.values(v).some(x => x === null)){ el.querySelector('.fb').className = 'fb bad'; el.querySelector('.fb').textContent = 'Füll erst alle Kästchen aus ✏️'; return; }
  const r = s.check(v);
  if (r === true){
    el.classList.add('done'); el.querySelectorAll('input').forEach(i => i.disabled = true); el.querySelector('.btns').remove();
    el.querySelector('.fb').className = 'fb good'; el.querySelector('.fb').textContent = pick(['Richtig! ✅','Super! ✅','Genau! ✅','Prima! ✅']);
    SFX.ok(); say(pick(['Weiter so! 🌟','Klasse! Nächster Schritt.','Du machst das toll! 💜','Jawoll! 🐉']), true);
    s.after(v); next();
  } else {
    W.wrong++; SFX.no();
    el.querySelector('.fb').className = 'fb bad'; el.querySelector('.fb').textContent = r;
    el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
    say('Nicht schlimm – lies den Hinweis und probier nochmal! 💪');
  }
}
$('#steps').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const el = b.closest('.step');
  if (b.dataset.act === 'check') return checkStep(el);
  W.help++; // Tipp: Lösung des Schritts eintragen
  Object.entries(el._step.tip).forEach(([k, x]) => { const i = el.querySelector(`[data-k="${k}"]`); if (i) i.value = String(x).replace('.', ','); });
  el.querySelector('.fb').className = 'fb'; el.querySelector('.fb').textContent = 'So geht’s – schau es dir an und tippe dann auf Prüfen.';
});
function finish(){
  const w = W, stars = w.help === 0 && w.wrong <= 1 ? 3 : w.help <= 1 && w.wrong <= 3 ? 2 : 1;
  G.solved++; G.stars += stars; save(); hud();
  let weg;
  if (w.kind === 'frac'){
    const res = w.n === 0 ? '0' : w.q === 1 ? `<span>${w.n}</span>` : fr(w.n, w.q);
    const parts = [...new Set(w.line)]; if (w.q === 1 && w.n) parts.push(String(w.n));
    weg = `${fr(w.a0, w.b0)} ${OPS[w.op0]} ${fr(w.c0, w.d0)} = ${parts.join(' = ')}`;
    w.result = res;
  } else weg = `${w.x} · ${w.y} = ${w.mx} · ${w.my} : ${10 ** (w.dx + w.dy)} = ${w.res}`;
  $('#fertig').innerHTML = `<div class="big">🎉</div><div class="stars">${'⭐'.repeat(stars)}${'☆'.repeat(3 - stars)}</div>
    <h2 style="margin:6px 0">Geschafft!</h2><div class="weg">${weg}</div>
    <div class="btns" style="margin-top:12px"><button class="btn" id="againBtn">🎲 Nächste Aufgabe</button></div>`;
  $('#fertig').hidden = false;
  $('#againBtn').onclick = () => start(randomTask(G.kind));
  SFX.win(); say(stars === 3 ? 'Wow, alles allein gerechnet! 🏆' : 'Super gemacht! Mit Übung wird es immer leichter. 💜', true);
  const r = $('#fertig').getBoundingClientRect(); confetti(innerWidth / 2, Math.min(innerHeight / 2, r.top + 40), 60);
  $('#fertig').scrollIntoView({ behavior:'smooth', block:'center' });
}
// Ausgangsaufgabe für die Zusammenfassung merken
const _start = start;
start = t => { _start(t); if (t.kind === 'frac') Object.assign(W, { a0:t.a, b0:t.b, c0:t.c, d0:t.d, op0:t.op }); };

/* ================= Auswahl und eigene Aufgabe ================= */
function renderKinds(){ $('#kinds').innerHTML = KINDS.map(([id, e, l]) => `<button class="chip ${G.kind === id ? 'on' : ''}" data-kind="${id}">${e}<small>${l}</small></button>`).join(''); }
$('#kinds').onclick = e => { const b = e.target.closest('[data-kind]'); if (!b) return; G.kind = b.dataset.kind; save(); renderKinds(); start(randomTask(G.kind)); };
$('#newBtn').onclick = () => start(randomTask(G.kind));
let ownKind = 'frac';
function renderOwn(){
  $('#ownKinds').innerHTML = [['frac','½ Brüche'],['dec','0,5 Kommazahlen']].map(([id, l]) => `<button class="chip ${ownKind === id ? 'on' : ''}" data-ok="${id}">${l}</button>`).join('');
  $('#ownFrac').hidden = ownKind !== 'frac'; $('#ownDec').hidden = ownKind !== 'dec';
}
$('#ownBtn').onclick = () => { ownKind = G.kind[0] === 'd' ? 'dec' : 'frac'; if (G.kind[0] === 'f') $('#oop').value = G.kind[1]; renderOwn(); $('#ownModal').classList.add('open'); };
$('#ownKinds').onclick = e => { const b = e.target.closest('[data-ok]'); if (b){ ownKind = b.dataset.ok; renderOwn(); } };
$('#ownCancel').onclick = () => $('#ownModal').classList.remove('open');
$('#ownGo').onclick = () => {
  if (ownKind === 'frac'){
    const [a, b, c, d] = ['#oa','#ob','#oc','#od'].map(s => +$(s).value.trim());
    if (![a, b, c, d].every(x => Number.isInteger(x) && x >= 0 && x < 1000) || !b || !d){ toast('Bitte überall eine ganze Zahl eintragen – unten (Nenner) nicht 0 ✏️'); return; }
    const op = $('#oop').value;
    if (op === ':' && !c){ toast('Durch 0 kann man nicht teilen 🙈'); return; }
    if (op === '-' && a * d < c * b){ toast('Das Ergebnis wäre kleiner als 0 – tausch die Brüche 🔄'); return; }
    $('#ownModal').classList.remove('open'); start({ kind:'frac', op, a, b, c, d });
  } else {
    const ok = s => /^\d+(,\d+)?$/.test(s);
    const x = $('#ox').value.trim().replace('.', ','), y = $('#oy').value.trim().replace('.', ',');
    if (!ok(x) || !ok(y)){ toast('Schreib zwei Zahlen, z. B. 0,25 und 0,4 ✏️'); return; }
    $('#ownModal').classList.remove('open'); start({ kind:'dec', x, y });
  }
};
const hud = () => { $('#hud').textContent = `⭐ ${G.stars}`; };

$('#mascot').innerHTML = petSVG('drache');
$('#mascot').onclick = () => say(pick(['Rechenweg aufschreiben hilft! 📝','Du schaffst das! 💪','Erst denken, dann rechnen. 🤔']), true);
renderKinds(); hud();
</script>
</body>
